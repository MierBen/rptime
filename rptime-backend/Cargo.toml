[package]
name = "rptime-backend"
version = "0.1.0"
authors = ["MierBen <mrben838@gmail.com>"]
description = "Task-based CTF competition system."
edition = "2024"

[[bin]]
name = "rptime-server"
path = "src/main.rs"

#[[bin]]
#name = "rptime-manager"
#path = "src/main.rs"

[dependencies]
actix-web = { version = "4.11.0", features = ["cookies", "secure-cookies"] }
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["cookie-session"]}
chrono = { version = "0.4.9", features = ["serde"] }
clap = "4.5.46"
diesel = { version = "2.2.12", features = ["postgres", "r2d2", "chrono", "serde_json"] }
futures = "0.3.31"
git2 = "0.20.2"
lazy_static = "1.4.0"
log = { version = "0.4.8", features = ["serde"] }
regex = "1.3.1"
serde = { version = "1.0.101", features = ["derive"] }
simplelog = "0.12.2"
time = "0.3.41"
toml = "0.9.5"
uuid = { version = "1.18.0", features = ["v4"] }
